<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="apply_box">
            <h1>Job Application <span class="title_small">(Web)</span></h1>

            <form action="">
                <div class="form_container">
                    <div class="form_control">
                        <label for="first_name">First Name</label>
                        <input id="first_name" name="first_name" type="text" placeholder="Enter First Name">
                    </div>

                    <div class="form_control">
                        <label for="second_control">Second Name</label>
                        <input id="second_control" type="text" placeholder="Enter Second Name">
                    </div>

                    <div class="form_control">
                        <label for="email">Email</label>
                        <input id="email" type="email" placeholder="Enter your email">
                    </div>

                    <div class="form_control">
                        <label for="job_role">Job Role</label>
                        <select name="job_role" id="job_role">
                            <option value="">Select Job Role</option>
                            <option value="frontend">Frontend Developer</option>
                            <option value="backend">Backend Developer</option>
                            <option value="Full Stack developer">Full Stack developer</option>
                            <option value="UI UX Desginer">UI UX Desginer</option>
                        </select>
                    </div>

                    <div class="textarea_contorl">
                        <label for="address">Address</label>
                        <textarea name="address" id="address" rows="4" cols="50" placeholder="Enter address"></textarea>
                    </div>

                    <div class="form_control">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" placeholder="Enter City">
                    </div>

                    <div class="form_control">
                        <label for="pincode">Pincode</label>
                        <input type="number" placeholder="Enter pincode" id="pincode" name="pincode">
                    </div>

                    <div class="form">
                        <label for="date">Start Date</label>
                        <input value="2026-01-01" type="date" form="date" name="date">
                    </div>

                    <div class="form_control">
                        <label for="upload">Upload your CV</label>
                        <input type="file" id="upload" name="upload">
                    </div>
                </div>

                <div class="button_container">
                    <button type="submit">Apply Now</button>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
