<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="images_section">
            <aside>
                <img src="./images/side_image1.png" alt="Side Image">
                <img src="./images/side_image2.png" alt="Side Image">
                <img src="./images/side_image3.png" alt="Side Image">
                <img src="./images/side_image4.png" alt="Side Image">
                <img src="./images/side_image5.png" alt="Side Image">
                <img src="./images/side_image6.png" alt="Side Image">
            </aside>

            <section class="image_container">
                <img src="./images/center_image.png" alt="Center image">
            </section>

        </section>
        <section class="content">
            <div class="content_header">
                <p class="green-text">Sustainable Material</p>
                <h1>NIke Revolution 8</h1>
                <h4>Men's Road Running shoes</h4>
            </div>

            <section class="price_section">
                <h2>MRP = $0.00</h2>
                <div>
                    <p>Inclusive of all taxes</p>
                    <p>Also include all applicable duties</p>
                </div>
            </section>

            <section class="variants_section">
                <img src="./images/variant1.png" alt="variant1">
                <img src="./images/variant2.png" alt="variant2">
                <img src="./images/variant3.png" alt="variant3">
                <img src="./images/variant4.png" alt="variant4">
            </section>

            <section class="size_section">
                <div class="size_header">
                <h4>Select Size</h4>
                <h4>Size guide</h4>
            </div>

            <section class="sizes">
                <div class="size">UK 6</div>
                <div class="size">UK 6.5</div>
                <div class="size">UK 7</div>
                <div class="size">UK 7.5</div>
            </section>
            </section>

            <section class="button_container">
                <button class="add_to_bag">Add to Bag</button>
                <button class="wishlist">Wish List</button>
            </section>

        </section>
    </main>
</body>
</html>
